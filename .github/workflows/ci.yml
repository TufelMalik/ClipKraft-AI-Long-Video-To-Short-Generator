name: CI

on:
  push:
    branches: [main, codex/advanced-editing-plan]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Everything the collected tests import at module level, WITHOUT the
      # heavy ML stack (torch/ultralytics/mediapipe/faster-whisper) — the
      # pipeline modules import those lazily behind their feature gates, and
      # the tests exercise the gated-off paths. numpy+opencv cover the layout
      # modules, fastapi/boto3/PyJWT/python-multipart cover importing app.py
      # for the MCP endpoint tests, google-genai covers gemini_worker.
      - name: Install test dependencies
        run: >
          pip install pytest pillow httpx pydantic sqlalchemy greenlet numpy
          opencv-python-headless python-dotenv google-genai fastapi boto3
          PyJWT email-validator python-multipart -r requirements-longform.txt
      - name: Install FFmpeg for media tests
        # Real-media composition checks must run, not skip for missing FFmpeg.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run Python tests
        env:
          PYTHONPATH: .:backend:backend/pipeline:backend/services:backend/utils:backend/api
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
